[project]
name = "comfyui-fsd-nodes"
version = "2.0.0"
description = "FSD — унифицированное расширение ComfyUI: FSD_PIPE пайплайн-ноды, Danbooru Gallery, Style Selector, динамические Switch/Bypasser"
authors = [{ name = "FSD Contributors" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "aiohttp>=3.8.0",
    "Pillow>=9.0.0",
    "torch>=1.12.0",
    "numpy>=1.21.0",
    "aiosqlite>=0.17.0",
    "psutil>=5.9.0",
    "urllib3",
]
requires-python = ">=3.8"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["."]

[tool.setuptools.package-data]
"." = [
    "js/**/*.js",
    "js/**/*.txt",
    "js/**/*.md",
    "data/**/*.json",
    "data/**/*.csv",
]

[project.urls]
Homepage = "https://github.com/fsd/comfyui-fsd-nodes"
Repository = "https://github.com/fsd/comfyui-fsd-nodes.git"
Issues = "https://github.com/fsd/comfyui-fsd-nodes/issues"

[tool.comfy]
PublisherId = "fsd"
DisplayName = "FSD Nodes"
Icon = ""
